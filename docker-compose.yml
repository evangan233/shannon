# 项目名写死，与目录名解耦：无论 repo clone 到哪个目录（shannon / supernova / myfork …），
# compose 项目名恒为 supernova —— 容器/网络/volume 的 label 才能始终一致，
# scripts/up.sh 的 cleanup_stale_containers（按 project 过滤）也才能稳定看到自己的容器去清理。
# 优先级：-p flag / COMPOSE_PROJECT_NAME env > 本 name: > 目录名（故目录名不再起作用）。
name: supernova

networks:
  default:
    name: supernova-net

services:
  temporal:
    # 默认自建：裸 docker compose up 即起此服务。
    # 复用外部 temporal 时，docker-compose.override.external-temporal.yml
    # 会给本服务加 profiles:[disabled] 让它不启动，并改 web 连外部 temporal。
    # ./scripts/up.sh 自动判断走哪条路。
    image: temporalio/temporal:latest
    container_name: supernova-temporal
    command: ["server", "start-dev", "--db-filename", "/home/temporal/temporal.db", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:7233:7233"   # gRPC
      - "127.0.0.1:8233:8233"   # Web UI (built-in)
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: supernova-web
    ports:
      - "${SUPERNOVA_WEB_PORT:-7878}:7878"
    volumes:
      - ./workspaces:/app/workspaces
      - ./repos:/app/repos
      - ./configs:/app/configs
      - ./.env:/app/.env:ro
      # .env.profiles 含 SUPERNOVA_PROFILE 对应的引擎密钥（glm-anthropic.env 等），
      # 是 load_env() 启动扫描的硬依赖；不挂载则新扫描启动即崩 "profile 文件不存在"。
      # 同 .env 走 bind mount（宿主 gitignore 排除，随改随生效免重建）。
      - ./.env.profiles:/app/.env.profiles:ro
    env_file:
      - .env
    # 供 up.sh 的 compose up --wait 判定「web 就绪」（lifespan 完成后 /health 才 200）——
    # 脚本返回即可访问，消除 recreate 窗口「更新后第一次刷新连接拒绝」。python:3.12-slim
    # 无 curl，用 urllib 探测；worker 不加 healthcheck（忙时不至于假死误判，--wait 下
    # running 即算过）。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7878/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    # 内网 GitLab 在容器 DNS 解析不到/解析错 → clone 私仓失败；固定 hosts 映射。
    extra_hosts:
      - "gitlab.futunn.com:172.24.20.196"
    environment:
      - SUPERNOVA_WEB_SCAN_TIMEOUT=${SUPERNOVA_WEB_SCAN_TIMEOUT:-0}
      - SUPERNOVA_TEMPORAL_HOST=temporal
      - SUPERNOVA_TEMPORAL_PORT=7233
    depends_on:
      temporal:
        condition: service_healthy

  worker:
    # C1 Phase A：常驻 worker 容器，消费 WEB 固定 task queue（白盒 supernova-wb-web / 黑盒 supernova-bb-web）。
    # 装齐 gitnexus+agent-browser+chrome（共用镜像）；web 容器保持瘦。
    # scan_manager 已 C1 化（Phase B）：web 端 start_workflow 提交到本 worker 消费的 queue，不再 fork CLI。
    #
    # platform: linux/amd64 —— tree-sitter（gitnexus 依赖的代码语法解析 native 模块，含 11 个语言 binding）
    # 无 linux-arm64 预编译、容器又无编译工具链 → arm64 镜像下 `gitnexus mcp` 启动即崩（"closed connection"，
    # stderr 被 GitNexusMCPClient 接到 DEVNULL 故 workflow.log 里看不到 native build 报错）。强制 amd64 用现成
    # linux-x64 prebuild；chromium apt 包 amd64 也有，黑盒不受影响。代价：arm64 宿主经 qemu 模拟有性能损失
    # （扫描瓶颈在 LLM 调用，gitnexus 占比小，可接受）。
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    platform: linux/amd64
    container_name: supernova-worker
    volumes:
      - ./workspaces:/app/workspaces
      - ./repos:/app/repos
      - ./configs:/app/configs
      - ./.env:/app/.env:ro
      - ./.env.profiles:/app/.env.profiles:ro
    env_file:
      - .env
    # 同 web：黑盒扫 gitlab.futunn.com 目标时容器内直连需固定解析。
    extra_hosts:
      - "gitlab.futunn.com:172.24.20.196"
    environment:
      - SUPERNOVA_TEMPORAL_HOST=temporal
      - SUPERNOVA_TEMPORAL_PORT=7233
      - SUPERNOVA_TEMPORALIO_LOG_LEVEL=${SUPERNOVA_TEMPORALIO_LOG_LEVEL:-WARNING}
      # 全局扫描闸门（spec 2026-09-08-worker-scan-gate §9）：快照落 workspaces
      # bind mount（web/worker 容器共享），供 /api/scan/gate 读展示。
      - SUPERNOVA_SCAN_GATE_CAPACITY=${SUPERNOVA_SCAN_GATE_CAPACITY:-5}
      - SUPERNOVA_SCAN_GATE_MAX_WAITING=${SUPERNOVA_SCAN_GATE_MAX_WAITING:-50}
      - SUPERNOVA_SCAN_GATE_STATE_FILE=/app/workspaces/gate_state.json
    depends_on:
      temporal:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${SUPERNOVA_WORKER_CPUS:-8}'
          memory: '${SUPERNOVA_WORKER_MEMORY:-4g}'
    restart: unless-stopped

volumes:
  temporal-data:
