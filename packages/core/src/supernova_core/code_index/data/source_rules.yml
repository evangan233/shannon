# Source 规则库 —— 映射 SourceRule(source_detector.py)。
#
# 字段:
#   rule_id      规则标识(唯一)
#   languages    适用语言列表
#   pattern      正则字符串;group(1) 必须捕获 param_name。YAML 双引号串里反斜杠须双写(\\)、
#                内嵌双引号用 \"、单引号原样 '。
#   source_type  ParameterSource 枚举值:
#                  query/path/body/form/header/cookie/file/session/internal/unknown
#                  /rpc(RPC 请求消息字段,2026-09-15)/socket(收包数据,2026-09-15)
#
# 未知 source_type → loader fail-fast(ValueError)。

rules:
  # ===== Express / Node.js(typescript/javascript)=====
  - rule_id: ts-express-path
    languages: [typescript, javascript]
    pattern: "req\\.params\\.([A-Za-z_]\\w*)"
    source_type: path

  - rule_id: ts-express-query
    languages: [typescript, javascript]
    pattern: "req\\.query\\.([A-Za-z_]\\w*)"
    source_type: query

  - rule_id: ts-express-body
    languages: [typescript, javascript]
    pattern: "req\\.body\\.([A-Za-z_]\\w*)"
    source_type: body

  - rule_id: ts-express-header
    languages: [typescript, javascript]
    pattern: "req\\.(?:headers|header)\\.([A-Za-z_]\\w*)"
    source_type: header

  - rule_id: ts-express-cookie
    languages: [typescript, javascript]
    pattern: "req\\.cookies\\.([A-Za-z_]\\w*)"
    source_type: cookie

  # ===== Koa(ctx.*)——补 Express 规则盲区(trip 等Koa项目主力 source 写法)=====
  - rule_id: ts-koa-body
    languages: [typescript, javascript]
    pattern: "ctx\\.request\\.body\\.([A-Za-z_]\\w*)"
    source_type: body

  - rule_id: ts-koa-query
    languages: [typescript, javascript]
    pattern: "ctx\\.request\\.query\\.([A-Za-z_]\\w*)"
    source_type: query

  - rule_id: ts-koa-query-direct
    languages: [typescript, javascript]
    pattern: "ctx\\.query\\.([A-Za-z_]\\w*)"
    source_type: query

  - rule_id: ts-koa-params
    languages: [typescript, javascript]
    pattern: "ctx\\.params\\.([A-Za-z_]\\w*)"
    source_type: path

  - rule_id: ts-koa-headers
    languages: [typescript, javascript]
    pattern: "ctx\\.(?:request\\.)?headers?\\.([A-Za-z_]\\w*)"
    source_type: header

  # ===== Django / Flask(python)=====
  - rule_id: py-django-get
    languages: [python]
    pattern: "request\\.GET\\[['\"]([A-Za-z_]\\w*)['\"]\\]"
    source_type: query

  - rule_id: py-django-post
    languages: [python]
    pattern: "request\\.POST\\[['\"]([A-Za-z_]\\w*)['\"]\\]"
    source_type: body

  - rule_id: py-flask-args
    languages: [python]
    pattern: "request\\.args\\[['\"]([A-Za-z_]\\w*)['\"]\\]"
    source_type: query

  - rule_id: py-flask-form
    languages: [python]
    pattern: "request\\.form\\[['\"]([A-Za-z_]\\w*)['\"]\\]"
    source_type: body

  - rule_id: py-flask-json
    languages: [python]
    pattern: "request\\.json\\[['\"]([A-Za-z_]\\w*)['\"]\\]"
    source_type: body

  # ===== PHP =====
  - rule_id: php-get
    languages: [php]
    pattern: "\\$_GET\\[['\"]([A-Za-z_]\\w*)['\"]\\]"
    source_type: query

  - rule_id: php-post
    languages: [php]
    pattern: "\\$_POST\\[['\"]([A-Za-z_]\\w*)['\"]\\]"
    source_type: body

  - rule_id: php-request
    languages: [php]
    pattern: "\\$_REQUEST\\[['\"]([A-Za-z_]\\w*)['\"]\\]"
    source_type: query

  # ===== Go Gin =====
  - rule_id: go-gin-query
    languages: [go]
    pattern: "c\\.Query\\(['\"]([A-Za-z_]\\w*)['\"]\\)"
    source_type: query

  - rule_id: go-gin-param
    languages: [go]
    pattern: "c\\.Param\\(['\"]([A-Za-z_]\\w*)['\"]\\)"
    source_type: path

  - rule_id: go-gin-postform
    languages: [go]
    pattern: "c\\.PostForm\\(['\"]([A-Za-z_]\\w*)['\"]\\)"
    source_type: body

  # ===== Java Spring(注解式参数)=====
  - rule_id: java-request-param
    languages: [java]
    pattern: "@RequestParam(?:\\([^)]*\\))?\\s+\\w+\\s+([A-Za-z_]\\w*)"
    source_type: query

  - rule_id: java-path-variable
    languages: [java]
    pattern: "@PathVariable(?:\\([^)]*\\))?\\s+\\w+\\s+([A-Za-z_]\\w*)"
    source_type: path

  # ===== 补充:vuln-range 三项目反哺 source 缺口 =====

  # Java @RequestBody(crAPI 最高频 source,13 处;原规则只有 @RequestParam/@PathVariable)
  - rule_id: java-request-body
    languages: [java]
    pattern: "@RequestBody(?:\\s*\\([^)]*\\))?\\s+\\w+\\s+([A-Za-z_]\\w*)"
    source_type: body

  # Python DRF request.data(crAPI workshop 主力 source;原规则只有 request.GET/POST/args/form/json)
  - rule_id: py-drf-request-data
    languages: [python]
    pattern: "request\\.data(?:\\[['\"]|\\.get\\(['\"])([A-Za-z_]\\w*)"
    source_type: body

  # Go net/http r.URL.Query().Get(crAPI Go 非 Gin;原规则只有 Gin c.Query/Param/PostForm)
  - rule_id: go-nethttp-query
    languages: [go]
    pattern: "r\\.URL\\.Query\\(\\)\\.Get\\(['\"]([A-Za-z_]\\w*)['\"]\\)"
    source_type: query

  # ===================================================================
  # deepsec 吸收 §2(deepsec matchers/source-*.ts):框架 source 补召回
  # source 是文本正则,group(1)=param_name(字段名;无字段名的方法调用用方法名/变量名占位)
  # ===================================================================

  # ===== §2.1 JS/TS Hono / Fastify / Next(原规则只覆盖 Express req.* / Koa ctx.*)=====
  - rule_id: ts-hono-query
    languages: [typescript, javascript]
    pattern: "c\\.req\\.query\\(['\"](\\w+)['\"]\\)"
    source_type: query
  - rule_id: ts-hono-param
    languages: [typescript, javascript]
    pattern: "c\\.req\\.param\\(['\"](\\w+)['\"]\\)"
    source_type: path
  - rule_id: ts-hono-json
    languages: [typescript, javascript]
    pattern: "c\\.req\\.(json|text)\\(\\)"   # group1=方法名占位(无字段名)
    source_type: body
  - rule_id: ts-hono-formdata
    languages: [typescript, javascript]
    pattern: "c\\.req\\.(formData)\\(\\)"
    source_type: form
  - rule_id: ts-fastify-query
    languages: [typescript, javascript]
    pattern: "request\\.query\\.([A-Za-z_]\\w*)"
    source_type: query
  - rule_id: ts-fastify-params
    languages: [typescript, javascript]
    pattern: "request\\.params\\.([A-Za-z_]\\w*)"
    source_type: path
  - rule_id: ts-fastify-body
    languages: [typescript, javascript]
    pattern: "request\\.body\\.([A-Za-z_]\\w*)"
    source_type: body
  - rule_id: ts-fastify-headers
    languages: [typescript, javascript]
    pattern: "request\\.headers\\.([A-Za-z_]\\w*)"
    source_type: header
  - rule_id: ts-next-searchparams
    languages: [typescript, javascript]
    pattern: "nextUrl\\.searchParams\\.get\\(['\"](\\w+)['\"]\\)"
    source_type: query
  - rule_id: ts-next-json
    languages: [typescript, javascript]
    pattern: "\\brequest\\.(json)\\(\\)"   # Next route handler await request.json()
    source_type: body
  - rule_id: ts-next-formdata
    languages: [typescript, javascript]
    pattern: "\\brequest\\.(formData)\\(\\)"
    source_type: form
  - rule_id: ts-fetch-headers-get
    languages: [typescript, javascript]
    pattern: "request\\.headers\\.get\\(['\"]([\\w-]+)['\"]\\)"
    source_type: header

  # ===== §2.2 Python Flask method 式访问器(原规则只有索引写法 request.GET['x'])=====
  - rule_id: py-flask-args-get
    languages: [python]
    pattern: "request\\.args\\.get\\(['\"](\\w+)['\"]\\)"
    source_type: query
  - rule_id: py-flask-form-get
    languages: [python]
    pattern: "request\\.form\\.get\\(['\"](\\w+)['\"]\\)"
    source_type: form
  - rule_id: py-flask-json-get
    languages: [python]
    pattern: "request\\.json\\.get\\(['\"](\\w+)['\"]\\)"
    source_type: body
  - rule_id: py-flask-get-json
    languages: [python]
    pattern: "request\\.(get_json)\\(\\)"   # group1=方法名占位(无字段名);request.get_json() 返回整个 body
    source_type: body
  - rule_id: py-flask-headers-get
    languages: [python]
    pattern: "request\\.headers\\.get\\(['\"]([\\w-]+)['\"]\\)"
    source_type: header
  - rule_id: py-flask-cookies-get
    languages: [python]
    pattern: "request\\.cookies\\.get\\(['\"](\\w+)['\"]\\)"
    source_type: cookie
  - rule_id: py-flask-files-get
    languages: [python]
    pattern: "request\\.files\\.get\\(['\"](\\w+)['\"]\\)"
    source_type: file

  # ===== §2.3 Go(原规则只有 Gin c.Query/Param/PostForm + net/http r.URL.Query)=====
  - rule_id: go-gin-getheader
    languages: [go]
    pattern: "c\\.GetHeader\\(['\"]([\\w-]+)['\"]\\)"
    source_type: header
  - rule_id: go-gin-shouldbindjson
    languages: [go]
    pattern: "c\\.ShouldBindJSON\\(&(\\w+)\\)"   # group1=绑定变量名占位
    source_type: body
  - rule_id: go-net-formvalue
    languages: [go]
    pattern: "r\\.FormValue\\(['\"](\\w+)['\"]\\)"
    source_type: form
  - rule_id: go-net-postformvalue
    languages: [go]
    pattern: "r\\.PostFormValue\\(['\"](\\w+)['\"]\\)"
    source_type: form
  - rule_id: go-net-header-get
    languages: [go]
    pattern: "r\\.Header\\.Get\\(['\"]([\\w-]+)['\"]\\)"
    source_type: header
  - rule_id: go-net-cookie
    languages: [go]
    pattern: "r\\.Cookie\\(['\"](\\w+)['\"]\\)"
    source_type: cookie

  # ===== §2.6 RPC / Socket 入口 source(2026-09-15 单仓跨服务补齐)=====
  # gRPC service 方法体内对请求消息的取用(pb 生成 getter / 直接字段访问);
  # receiver 限定 req 形态惯例名,且 detect_sources 只在 entry(签名已识别为
  # grpc_service)内扫——双层结构收敛「req.Xxx 泛 struct 访问」误报。
  - rule_id: go-grpc-req-getter
    languages: [go]
    pattern: "\\b(?:req|request|in|msg|input|payload)\\.Get([A-Z]\\w*)\\(\\)"
    source_type: rpc
  - rule_id: go-grpc-req-field
    languages: [go]
    pattern: "\\b(?:req|request|in|msg|input|payload)\\.([A-Z]\\w*)\\b(?!\\()"
    source_type: rpc
  # socket 收包读调用(net.Conn.Read / websocket ReadMessage/ReadJSON/
  # ReadString/ReadBytes...;group(1)=方法名占位,仿 ts-hono-json 先例)。
  # 只认 Read 前缀——出站 Write 不是 source。
  - rule_id: go-socket-read
    languages: [go]
    pattern: "\\b(?:conn|c|ws|client|session)\\.(Read\\w*)\\("
    source_type: socket

  # ===== §2.4 Java 注解 + HttpServlet(原规则有 @RequestParam/@PathVariable/@RequestBody)=====
  # 注:header/cookie 注解的 header 名可含 '-',捕获组用 [\\w-]+
  - rule_id: j-spring-requestheader
    languages: [java]
    pattern: "@RequestHeader\\(['\"]?([\\w-]+)['\"]?\\)?"
    source_type: header
  - rule_id: j-spring-cookievalue
    languages: [java]
    pattern: "@CookieValue\\(['\"]?([\\w-]+)['\"]?\\)?"
    source_type: cookie
  - rule_id: j-spring-requestpart
    languages: [java]
    pattern: "@RequestPart\\(['\"]?(\\w+)['\"]?\\)?"
    source_type: body
  - rule_id: j-jaxrs-queryparam
    languages: [java]
    pattern: "@QueryParam\\(['\"](\\w+)['\"]\\)"
    source_type: query
  - rule_id: j-jaxrs-pathparam
    languages: [java]
    pattern: "@PathParam\\(['\"](\\w+)['\"]\\)"
    source_type: path
  - rule_id: j-jaxrs-headerparam
    languages: [java]
    pattern: "@HeaderParam\\(['\"]([\\w-]+)['\"]\\)"
    source_type: header
  - rule_id: j-jaxrs-formparam
    languages: [java]
    pattern: "@FormParam\\(['\"](\\w+)['\"]\\)"
    source_type: form
  - rule_id: j-httpservlet-getparameter
    languages: [java]
    pattern: "\\.getParameter\\(['\"](\\w+)['\"]\\)"
    source_type: query
  - rule_id: j-httpservlet-getheader
    languages: [java]
    pattern: "\\.getHeader\\(['\"]([\\w-]+)['\"]\\)"
    source_type: header
  - rule_id: j-httpservlet-getcookies
    languages: [java]
    pattern: "\\.(getCookies)\\(\\)"   # group1=方法名占位(返回 Cookie[] 整体)
    source_type: cookie

  # ===== §2.5 PHP superglobal 补齐 + Laravel(原规则只有 $_GET/$_POST/$_REQUEST)=====
  - rule_id: php-superglobal-cookie
    languages: [php]
    pattern: "\\$_COOKIE\\[['\"](\\w+)['\"]\\]"
    source_type: cookie
  - rule_id: php-superglobal-files
    languages: [php]
    pattern: "\\$_FILES\\[['\"](\\w+)['\"]\\]"
    source_type: file
  - rule_id: php-superglobal-server
    languages: [php]
    pattern: "\\$_SERVER\\[['\"](\\w+)['\"]\\]"
    source_type: header
  - rule_id: php-laravel-input
    languages: [php]
    pattern: "\\$request->input\\(['\"](\\w+)['\"]\\)"
    source_type: body
  - rule_id: php-laravel-query
    languages: [php]
    pattern: "\\$request->query\\(['\"](\\w+)['\"]\\)"
    source_type: query
  - rule_id: php-laravel-route
    languages: [php]
    pattern: "\\$request->route\\(['\"](\\w+)['\"]\\)"
    source_type: path
  - rule_id: php-laravel-file
    languages: [php]
    pattern: "\\$request->file\\(['\"](\\w+)['\"]\\)"
    source_type: file

